# ============================================================================
# Cấu hình tổng thể
# Ứng dụng mô hình học máy trong hỗ trợ kiểm duyệt tín dụng
#
# Toàn bộ tham số của đề án được đặt tập trung tại đây: bộ sinh dữ liệu, quy
# tắc tiền xử lý, định nghĩa đặc trưng, quy tắc gán nhãn, cấu hình huấn luyện
# và ngưỡng ra quyết định. Nhờ vậy mọi thành phần dùng chung một nguồn tham số
# duy nhất và kết quả thực nghiệm lặp lại được.
# ============================================================================

project:
  name: CreditReview
  title: "Ứng dụng mô hình học máy trong hỗ trợ kiểm duyệt tín dụng"
  version: "2.0.0"
  author: "Dong Quoc Huy - B25CHHT028"
  seed: 20260101

paths:
  data_raw: data/raw
  data_processed: data/processed
  models: results/models
  figures: results/figures
  tables: results/tables
  logs: results/logs

# ---------------------------------------------------------------------------
# 1. Thu thập và tổng hợp dữ liệu
# ---------------------------------------------------------------------------
datagen:
  n_customers: 40000
  n_applications: 60000
  # Số giao dịch trung bình mỗi khách hàng trong 30 ngày
  avg_txn_per_month: 9.0
  # Độ dài cửa sổ lịch sử giao dịch sinh ra trước hồ sơ cuối cùng (ngày)
  txn_lookback_days: 240
  observation_start: "2024-07-01"
  observation_end: "2026-06-30"
  # Cửa sổ quan sát hiệu quả trả nợ (performance window) tính theo tháng
  performance_window_months: 12
  target_default_rate: 0.152
  # Tỷ lệ khách hàng "thin-file" (không/ít thông tin tại CIC)
  thin_file_rate: 0.11
  # Tỷ lệ thiếu dữ liệu ở một số trường khai báo
  missing_income_rate: 0.045
  # Mức độ trôi dạt dữ liệu theo thời gian (concept drift) - log-odds/năm
  drift_logodds_per_year: 0.28

# ---------------------------------------------------------------------------
# 2. Tiền xử lý và làm sạch dữ liệu
# ---------------------------------------------------------------------------
preprocessing:
  # Hệ số k của quy tắc k×IQR khi thống kê ngoại lệ
  outlier_iqr_k: 3.0
  # Phân vị dùng để cắt ngọn (winsorize) giá trị cực trị
  winsorize_lower_q: 0.01
  winsorize_upper_q: 0.99
  # Ngưỡng tỷ lệ khuyết mà trên đó biến bị xem xét loại bỏ (%)
  max_missing_pct: 30.0

# ---------------------------------------------------------------------------
# 3. Trích xuất và lựa chọn đặc trưng
# ---------------------------------------------------------------------------
features:
  # Các cửa sổ thời gian (ngày) dùng để tổng hợp đặc trưng hành vi giao dịch
  txn_windows_days: [7, 30, 90, 180]
  selection:
    enabled: true
    # Ngưỡng Information Value tối thiểu để giữ lại một đặc trưng
    min_iv: 0.02
    # Ngưỡng IV tối đa - vượt mức này gần như chắc chắn là rò rỉ nhãn.
    # Đặt ở mức 2,0 vì nhóm đặc trưng CIC vốn có IV cao (0,9-1,3) do phản ánh
    # trực tiếp lịch sử trả nợ; các biến này đã được kiểm tra tính đúng đắn
    # theo thời điểm (bản tin CIC luôn được truy vấn trước khi nộp hồ sơ) nên
    # IV cao là bản chất của dữ liệu, không phải dấu hiệu rò rỉ.
    max_iv: 2.00
    # Ngưỡng tương quan tuyệt đối để loại đặc trưng dư thừa
    max_correlation: 0.95
    # Ngưỡng PSI tối đa để giữ lại đặc trưng (độ ổn định theo thời gian)
    max_psi: 0.25

# ---------------------------------------------------------------------------
# 4. Xây dựng nhãn và quy tắc phê duyệt
# ---------------------------------------------------------------------------
labeling:
  # Cửa sổ quan sát hiệu quả trả nợ (tháng)
  performance_window_months: 12
  # Ngưỡng số ngày quá hạn xác định nợ xấu (nhóm 3-5 theo phân loại nợ)
  bad_debt_dpd: 90
  bad_debt_groups: [3, 4, 5]
  # Tỷ lệ hồ sơ mong muốn rơi vào vùng chuyển thẩm định thủ công
  target_review_rate: 0.20
  # Trần tỷ lệ nợ xấu trong nhóm hồ sơ được khuyến nghị duyệt
  max_bad_rate_approved: 0.05

# ---------------------------------------------------------------------------
# 5. Chia tập dữ liệu (kiểm định ngoài thời gian)
# ---------------------------------------------------------------------------
split:
  strategy: out_of_time        # out_of_time | random | by_customer
  train_ratio: 0.70
  valid_ratio: 0.15
  test_ratio: 0.15

# ---------------------------------------------------------------------------
# 6. Huấn luyện và tối ưu mô hình
# ---------------------------------------------------------------------------
training:
  cv_folds: 5
  n_jobs: -1
  class_weight_strategy: balanced   # balanced | none | smote
  calibration: isotonic             # isotonic | sigmoid | none
  # Ngưỡng quyết định được tối ưu theo hàm chi phí nghiệp vụ
  cost_fn: 12.0     # chi phí bỏ sót một hồ sơ xấu (False Negative)
  cost_fp: 1.0      # chi phí từ chối sai một hồ sơ tốt (False Positive)
  models:
    # Năm thuật toán trọng tâm theo nội dung nghiên cứu
    - logistic_regression
    - decision_tree
    - random_forest
    - svm
    - gradient_boosting
    # Các biến thể mở rộng dùng để đối chiếu
    - scorecard_woe
    - extra_trees
    - xgboost
    - lightgbm
    - catboost
    - mlp
    - stacking_ensemble

# ---------------------------------------------------------------------------
# 7. Bộ máy hỗ trợ ra quyết định: luật nghiệp vụ + ngưỡng rủi ro
# ---------------------------------------------------------------------------
decision:
  # Ngưỡng xác suất vỡ nợ (PD) phân vùng khuyến nghị
  pd_approve_max: 0.08       # PD < 8%  -> khuyến nghị duyệt
  pd_reject_min: 0.32        # PD > 32% -> khuyến nghị từ chối
  # Vùng giữa hai ngưỡng -> chuyển thẩm định thủ công
  risk_bands:
    - {name: "AA", pd_max: 0.02}
    - {name: "A",  pd_max: 0.05}
    - {name: "BBB", pd_max: 0.08}
    - {name: "BB", pd_max: 0.15}
    - {name: "B",  pd_max: 0.25}
    - {name: "CCC", pd_max: 0.40}
    - {name: "D",  pd_max: 1.01}
  rules:
    min_age: 20
    max_age: 62
    min_monthly_income: 6000000        # VND
    max_dti: 0.60                      # Debt-to-Income
    max_cic_worst_group: 2             # nhóm nợ xấu nhất 12 tháng cho phép
    max_dpd_12m: 30                    # số ngày quá hạn tối đa 12 tháng
    max_num_institutions: 6
    max_ltv: 0.85                      # Loan-to-Value với hồ sơ có TSBĐ
    min_job_tenure_months: 6
    max_inquiries_3m: 5

# ---------------------------------------------------------------------------
# 8. Mô phỏng luồng xử lý hồ sơ và tích hợp dịch vụ
# ---------------------------------------------------------------------------
serving:
  host: "0.0.0.0"
  port: 8000
  # Số hồ sơ dùng trong kịch bản mô phỏng luồng xử lý
  simulation_applications: 5000
  # Số lần đo lặp lại khi thống kê thời gian xử lý một hồ sơ
  timing_repeats: 2000

# ---------------------------------------------------------------------------
# 9. Giám sát mô hình
# ---------------------------------------------------------------------------
monitoring:
  psi_bins: 10
  psi_warn: 0.10
  psi_alert: 0.25
  auc_drop_alert: 0.05
